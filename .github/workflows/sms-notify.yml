name: SMS Notify

# Runs every 15 minutes during 10am-10pm EDT (14:00-02:00 UTC, crossing midnight).
# Gated by the SEASON_ACTIVE repository variable — set it to any non-empty value in
# repo Settings > Variables to enable live runs. Clear it during the off-season.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER
#   SUBSCRIBER_PHONE_NUMBER
on:
  schedule:
    - cron: "*/15 14-23,0-2 * * *"

jobs:
  notify:
    if: vars.SEASON_ACTIVE != ''
    runs-on: ubuntu-latest
    env:
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      SUBSCRIBER_PHONE_NUMBER: ${{ secrets.SUBSCRIBER_PHONE_NUMBER }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache/
          key: sms-cache-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: sms-cache-${{ runner.os }}-

      - name: Run scheduled SMS notifications
        run: python3 main.py --scheduled
